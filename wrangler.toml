# Cloudflare Worker config for the IRIS push relay.
#
# Cloudflare deploys this from the GitHub repo, so there is nothing to paste
# into a dashboard editor — pushing to main redeploys it.
#
# The Worker's own code lives in worker/index.js.
#
# Secrets are NOT here (a repository is the wrong place for a credential). Set
# them once in the Cloudflare dashboard, under the Worker's
# Settings → Variables and Secrets:
#   FIREBASE_SERVICE_ACCOUNT   the whole service-account JSON, as a Secret
#   FIREBASE_PROJECT_ID        the Firebase project id

# Cloudflare names the Worker after the Git-connected project, which is why the
# deployed Worker is "chatter2" and not the name below — that project setting
# wins. Kept in step so the config matches what is actually deployed.
name = "chatter2"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Run once a minute. This is the whole mechanism: notice new messages, wake the
# recipients. Cloudflare's minimum granularity is one minute, so that is the
# fastest this can be — up to a minute of delay, which is the trade-off for
# doing it without the paid Firebase plan.
[triggers]
crons = ["* * * * *"]

# Encrypted media lives in Workers KV. The binding is the ONLY credential this
# needs — no access keys, no secret token, no card. Everything stored is
# ciphertext: the app encrypts each file with a random per-file key before
# upload, and that key travels inside the end-to-end encrypted message, so the
# namespace holds nothing readable.
#
# WHY KV AND NOT R2: R2 is the better tool for blobs, but it requires a card on
# file even within its free tier. KV does not — it is part of the standard
# Workers free plan. The trade-off is eventual consistency (a blob can take up to
# about a minute to appear in another region) and a 1,000-write-per-day ceiling.
#
# TO SET THIS UP (one time):
#   1. Cloudflare dashboard -> Storage & Databases -> KV -> Create namespace.
#      Name it anything, e.g. iris-media.
#   2. Copy the namespace ID it shows you (a long hex string).
#   3. Paste it in below and uncomment the three lines.
# Then commit — the Worker redeploys itself and media starts working.
#
# DELIBERATELY COMMENTED OUT. An uncommented binding with a placeholder id makes
# the whole Worker fail to deploy, which would take push notifications down with
# it — a working feature broken to set up a new one. Left off, the Worker deploys
# exactly as before, pushes keep working, and only the /media routes answer 503
# until a real id is filled in.
#
# [[kv_namespaces]]
# binding = "MEDIA"
# id = "PASTE_KV_NAMESPACE_ID_HERE"
