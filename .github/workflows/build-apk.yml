name: Build Android APK

# Builds a standalone, installable RELEASE APK in GitHub's cloud.
#
# Why release and not debug? A debug APK needs a Metro dev server running to
# feed it the JavaScript; installed on its own it shows
# "Unable to load script". A release APK embeds the JavaScript bundle, so it
# runs standalone. We sign it with a generated key so it can be installed.
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. Repo > Settings > Secrets and variables > Actions > New repository secret
#        GOOGLE_SERVICES_JSON = <contents of your google-services.json>
#   3. Actions tab > "Build Android APK" > Run workflow.
#   4. Download the "chatter-release-apk" artifact and install app-release.apk.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Firebase secret is present
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: the GOOGLE_SERVICES_JSON secret is missing."
            echo "Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Write Firebase config
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc -p tsconfig.check.json

      - name: Crypto + session tests
        run: npm run test:crypto

      - name: Service tests (users, chats, messages, outbox, history)
        run: npm run test:services

      - name: Component tests
        # Informational for now: these need jest-expo's native mocks, so a failure
        # here should be looked at but should not block shipping an APK.
        continue-on-error: true
        run: npm run test:components

      - name: Generate the native Android project (prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Generate a signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass android -keypass android \
            -alias chatter -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Chatter, OU=Dev, O=Chatter, L=NA, ST=NA, C=IN"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=chatter \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatter-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
